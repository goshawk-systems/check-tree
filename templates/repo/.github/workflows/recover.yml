# One recovery rule (a lost job is re-run once, a real failure never) and the stuck-PR alarm.
# The names under workflow_run must equal the `name:` of pr-check.yml and queue-suite.yml.
name: Recover
on:
  workflow_run:
    workflows: ["PR check", "Queue suite"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  actions: write       # re-run a run
  pull-requests: write # the one comment per stuck head
  issues: write
  contents: read
  statuses: read
concurrency:
  group: recover-${{ github.event_name }}-${{ github.event.workflow_run.id || 'sweep' }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Recover a completed run (workflow_run)
        if: github.event_name == 'workflow_run'
        run: python3 -m ops.recover event
      - name: Sweep stuck PRs and missed runs (schedule)
        if: github.event_name != 'workflow_run'
        run: python3 -m ops.recover sweep --max-calls 150
