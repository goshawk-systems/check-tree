# Daily: a test that failed in a queue run and passed in a run holding the identical PR heads is quarantined
# for 48 hours (at most 5 at once) by a DRAFT pull request. Nothing is merged here.
name: Flaky quarantine
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
permissions:
  actions: read
  contents: write
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Find flaky tests and write entries
        run: python3 -m ops.quarantine --propose --body-file "$RUNNER_TEMP/quarantine-pr-body.md"
      - name: Open a draft pull request with the entries
        run: |
          set -euo pipefail
          files=$(git status --porcelain -- tests/quarantine | awk '{print $2}')
          [ -n "$files" ] || { echo "no flaky test today"; exit 0; }
          branch="quarantine/$(date -u +%Y-%m-%d)"
          git config user.name "check-tree ops"; git config user.email "ops@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- $files
          git commit -m "Quarantine flaky tests for 48 hours"
          git push origin "$branch"
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Quarantine flaky tests ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/quarantine-pr-body.md"
